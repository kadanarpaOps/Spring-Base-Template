name: Deploy Branch on Environment
on:
  workflow_dispatch:
    inputs:
      target-branch:
        required: true
        description: 'Target Branch to Deploy'
      environment:
        required: true
        description: 'Environment to Deploy'

jobs:
  deploy-branch:
    uses: kadanarpaOps/Ops-Github-Workflows/.github/workflows/deploy-branch.yml@main
    secrets:
      VPS_IP: ${{ secrets.VPS_IP }}
      VPS_PRIVATE_KEY: ${{ secrets.VPS_PRIVATE_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      HOSTINGER_MAIN_DNS: ${{ secrets.HOSTINGER_MAIN_DNS }}
      HOSTINGER_TOKEN: ${{ secrets.HOSTINGER_TOKEN }}
